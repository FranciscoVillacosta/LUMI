<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lumi - Dashboard de Salud</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Inter',sans-serif;
    background:#f8fafc;
}

</style>

</head>

<body class="text-gray-800">

<header class="bg-white/80 sticky top-0 z-50 border-b border-gray-100 px-6 py-4">

    <div class="max-w-7xl mx-auto flex justify-between items-center">

        <div class="flex items-center gap-2">

            <div class="w-8 h-8 rounded-full overflow-hidden">
                <img src="img/LUM.png">
            </div>

            <span class="text-xl font-bold tracking-tight">
                Lumi
            </span>

        </div>

    </div>

</header>

<main class="max-w-7xl mx-auto px-6 py-10">

    <h1 class="text-3xl font-bold mb-8">
        Hola, Franco - Tu Salud en Resumen
    </h1>

    <!-- TARJETAS -->

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">

        <!-- SPO2 -->

        <div class="bg-white p-6 rounded-[2rem] shadow-sm flex items-center gap-4 border border-gray-50">

            <div class="w-14 h-14 bg-indigo-50 rounded-2xl flex items-center justify-center text-2xl text-indigo-500">
                🫀
            </div>

            <div>

                <p class="text-sm text-gray-400 font-medium">
                    Oxigenación
                </p>

                <p class="text-2xl font-bold" id="spo2Actual">
                    0%
                </p>

                <p class="text-sm text-gray-400 mt-1">
                    5/22/2026
                </p>

            </div>

        </div>

        <!-- BPM -->

        <div class="bg-white p-6 rounded-[2rem] shadow-sm flex items-center gap-4 border border-gray-50">

            <div class="w-14 h-14 bg-pink-50 rounded-2xl flex items-center justify-center text-2xl text-pink-500">
                💓
            </div>

            <div>

                <p class="text-sm text-gray-400 font-medium">
                    Ritmo Cardíaco
                </p>

                <p class="text-2xl font-bold" id="bpmActual">
                    0 BPM
                </p>

                <p class="text-sm text-gray-400 mt-1">
                    5/22/2026
                </p>

            </div>

        </div>

    </div>

    <!-- TABLA -->

    <div class="bg-white rounded-[3rem] p-8 md:p-12 shadow-sm border border-gray-50">

        <h2 class="text-2xl font-bold mb-8">
            Historial de Lecturas
        </h2>

        <div class="overflow-x-auto">

            <table class="w-full text-left text-sm">

                <thead>

                    <tr class="text-gray-400 border-b border-gray-50">

                        <th class="py-3 font-semibold uppercase tracking-wider">
                            Fecha
                        </th>

                        <th class="py-3 font-semibold uppercase tracking-wider text-center">
                            SpO2
                        </th>

                        <th class="py-3 font-semibold uppercase tracking-wider text-center">
                            BPM
                        </th>

                    </tr>

                </thead>

                <tbody id="tablaHistorial" class="divide-y divide-gray-50">

                </tbody>

            </table>

        </div>

    </div>

</main>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

    getDatabase,
    ref,
    onValue

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

  apiKey: "AIzaSyCqm-ifnDLIYLlZBafR-wIO87CqTIh9zd0",

  authDomain: "yassin-lerma.firebaseapp.com",

  databaseURL: "https://yassin-lerma-default-rtdb.firebaseio.com",

  projectId: "yassin-lerma",

  storageBucket: "yassin-lerma.firebasestorage.app",

  messagingSenderId: "854070019092",

  appId: "1:854070019092:web:11585b434dd224ff519301"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const historialRef = ref(db, 'historial');

onValue(historialRef, (snapshot) => {

    const data = snapshot.val();

    if(!data) return;

    const tabla = document.getElementById("tablaHistorial");

    tabla.innerHTML = "";

    const lista = Object.values(data);

    lista.reverse();

    // MOSTRAR ÚLTIMO DATO

    const ultimo = lista[0];

    document.getElementById("spo2Actual").innerHTML =
    ultimo.spo2 + "%";

    document.getElementById("bpmActual").innerHTML =
    ultimo.bpm + " BPM";

    // TABLA

    lista.forEach((item) => {

        const fila = document.createElement("tr");

        fila.innerHTML = `

            <td class="py-4">
                5/22/2026
            </td>

            <td class="py-4 text-center font-bold text-indigo-600">
                ${item.spo2}%
            </td>

            <td class="py-4 text-center font-bold text-pink-600">
                ${item.bpm} BPM
            </td>

        `;

        tabla.appendChild(fila);

    });

});

</script>

</body>
</html>
