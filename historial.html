<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lumi - Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Inter',sans-serif;
    background:#f8fafc;
}

</style>

</head>

<body class="text-gray-800">

<!-- HEADER -->

<header class="bg-white border-b border-gray-100 px-6 py-4">

    <div class="max-w-7xl mx-auto flex items-center gap-3">

        <img src="img/LUM.png" class="w-10">

        <h1 class="text-2xl font-bold">
            Lumi
        </h1>

    </div>

</header>

<!-- CONTENIDO -->

<main class="max-w-7xl mx-auto px-6 py-10">

    <h1 class="text-3xl font-bold mb-8">
        Hola, Franco 👋
    </h1>

    <!-- CARDS -->

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">

        <!-- SPO2 -->

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-50 flex items-center gap-4">

            <div class="w-14 h-14 bg-indigo-50 rounded-2xl flex items-center justify-center text-2xl">
                🫀
            </div>

            <div>

                <p class="text-gray-400 text-sm">
                    Oxigenación
                </p>

                <p class="text-3xl font-bold text-indigo-600" id="spo2Actual">
                    0%
                </p>

            </div>

        </div>

        <!-- BPM -->

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-50 flex items-center gap-4">

            <div class="w-14 h-14 bg-pink-50 rounded-2xl flex items-center justify-center text-2xl">
                💓
            </div>

            <div>

                <p class="text-gray-400 text-sm">
                    Ritmo Cardíaco
                </p>

                <p class="text-3xl font-bold text-pink-500" id="bpmActual">
                    0 BPM
                </p>

            </div>

        </div>

        <!-- SENSOR -->

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-50 flex items-center gap-4">

            <div class="w-14 h-14 bg-emerald-50 rounded-2xl flex items-center justify-center text-2xl">
                📡
            </div>

            <div>

                <p class="text-gray-400 text-sm">
                    Estado
                </p>

                <p class="text-xl font-bold text-green-500">
                    Sensor Activo
                </p>

            </div>

        </div>

    </div>

    <!-- TABLA -->

    <div class="bg-white rounded-[3rem] p-8 shadow-sm border border-gray-50">

        <h2 class="text-2xl font-bold mb-8">
            Historial de Lecturas
        </h2>

        <div class="overflow-x-auto">

            <table class="w-full text-left">

                <thead>

                    <tr class="border-b border-gray-100 text-gray-400 uppercase text-sm">

                        <th class="py-4">
                            Sensor
                        </th>

                        <th class="py-4 text-center">
                            BPM
                        </th>

                        <th class="py-4 text-center">
                            SpO2
                        </th>

                    </tr>

                </thead>

                <tbody id="tablaDatos">

                </tbody>

            </table>

        </div>

    </div>

</main>

<!-- FIREBASE -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

  apiKey: "AIzaSyCqm-ifnDLIYLlZBafR-wIO87CqTIh9zd0",

  authDomain: "yassin-lerma.firebaseapp.com",

  databaseURL: "https://yassin-lerma-default-rtdb.firebaseio.com",

  projectId: "yassin-lerma",

  storageBucket: "yassin-lerma.firebasestorage.app",

  messagingSenderId: "854070019092",

  appId: "1:854070019092:web:11585b434dd224ff519301"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const datosRef = ref(db, 'oxigeno');

const tabla = document.getElementById("tablaDatos");

onValue(datosRef, (snapshot)=>{

    tabla.innerHTML = "";

    const data = snapshot.val();

    if(data){

        const keys = Object.keys(data).reverse();

        keys.forEach((key,index)=>{

            const item = data[key];

            // MOSTRAR ÚLTIMO DATO ARRIBA

            if(index == 0){

                document.getElementById("bpmActual").innerHTML =
                item.bpm + " BPM";

                document.getElementById("spo2Actual").innerHTML =
                item.spo2 + "%";
            }

            // AGREGAR A TABLA

            tabla.innerHTML += `

            <tr class="border-b border-gray-50 hover:bg-gray-50 transition">

                <td class="py-4 font-semibold">
                    MAX30102
                </td>

                <td class="py-4 text-center font-bold text-pink-500">
                    ${item.bpm}
                </td>

                <td class="py-4 text-center font-bold text-indigo-600">
                    ${item.spo2}%
                </td>

            </tr>

            `;
        });
    }

});

</script>

</body>
</html>
