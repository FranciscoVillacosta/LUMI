<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Monitor MAX30102</title>

  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial;
      text-align:center;
      margin-top:50px;
    }

    .card{
      background:#222;
      width:300px;
      margin:auto;
      padding:20px;
      border-radius:20px;
    }

    h1{
      color:#00ffcc;
    }

    .dato{
      font-size:40px;
      margin:20px;
    }
  </style>
</head>
<body>

<div class="card">

  <h1>MAX30102</h1>

  <div class="dato">
    ❤️ BPM:
    <span id="bpm">0</span>
  </div>

  <div class="dato">
    🩸 SpO2:
    <span id="spo2">0</span>%
  </div>

</div>

<script>

const firebaseURL =
"https://yassin-lerma-default-rtdb.firebaseio.com/oxigeno.json";

async function obtenerDatos(){

  try{

    const respuesta = await fetch(firebaseURL);

    const datos = await respuesta.json();

    if(!datos) return;

    // Obtener último registro
    const claves = Object.keys(datos);

    const ultimaClave = claves[claves.length - 1];

    const ultimoDato = datos[ultimaClave];

    document.getElementById("bpm").innerText =
      ultimoDato.bpm;

    document.getElementById("spo2").innerText =
      ultimoDato.spo2;

  }catch(error){

    console.log(error);
  }
}

// actualizar cada 2 segundos
setInterval(obtenerDatos,2000);

obtenerDatos();

</script>

</body>
</html>
