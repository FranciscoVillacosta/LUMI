<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lumi - Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    background:#f8fafc;
    font-family:Arial;
}

</style>

</head>
<body class="text-gray-800">

<header class="bg-white shadow-sm px-6 py-4">

<div class="max-w-6xl mx-auto flex items-center gap-3">

<img src="img/LUM.png" width="45">

<h1 class="text-2xl font-bold">
Lumi
</h1>

</div>

</header>

<main class="max-w-6xl mx-auto p-6">

<h2 class="text-3xl font-bold mb-8">
Monitor de Salud
</h2>

<!-- TARJETAS -->

<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">

<div class="bg-white rounded-3xl p-6 shadow">

<div class="text-5xl mb-4">
🫀
</div>

<p class="text-gray-400">
Oxigenación
</p>

<h2 id="spo2Actual" class="text-5xl font-bold text-indigo-600">
0%
</h2>

<p id="fechaActual1" class="mt-3 text-gray-500">
--
</p>

</div>

<div class="bg-white rounded-3xl p-6 shadow">

<div class="text-5xl mb-4">
💓
</div>

<p class="text-gray-400">
Ritmo Cardíaco
</p>

<h2 id="bpmActual" class="text-5xl font-bold text-pink-600">
0 BPM
</h2>

<p id="fechaActual2" class="mt-3 text-gray-500">
--
</p>

</div>

</div>

<!-- TABLA -->

<div class="bg-white rounded-3xl p-8 shadow">

<h2 class="text-2xl font-bold mb-6">
Historial de Lecturas
</h2>

<div class="overflow-auto">

<table class="w-full">

<thead>

<tr class="border-b text-gray-400">

<th class="text-left py-3">
Fecha
</th>

<th class="text-left py-3">
BPM
</th>

<th class="text-left py-3">
SpO2
</th>

</tr>

</thead>

<tbody id="tablaDatos">

</tbody>

</table>

</div>

</div>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyCqm-ifnDLIYLlZBafR-wIO87CqTIh9zd0",

authDomain: "yassin-lerma.firebaseapp.com",

databaseURL: "https://yassin-lerma-default-rtdb.firebaseio.com",

projectId: "yassin-lerma",

storageBucket: "yassin-lerma.firebasestorage.app",

messagingSenderId: "854070019092",

appId: "1:854070019092:web:11585b434dd224ff519301"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const datosRef = ref(db, 'oxigeno');

onValue(datosRef, (snapshot) => {

const data = snapshot.val();

if(!data) return;

const tabla = document.getElementById("tablaDatos");

tabla.innerHTML = "";

const registros = Object.values(data).reverse();

const ultimo = registros[0];

document.getElementById("spo2Actual").innerHTML =
ultimo.spo2 + "%";

document.getElementById("bpmActual").innerHTML =
ultimo.bpm + " BPM";

document.getElementById("fechaActual1").innerHTML =
ultimo.fecha;

document.getElementById("fechaActual2").innerHTML =
ultimo.fecha;

registros.forEach(item => {

tabla.innerHTML += `

<tr class="border-b">

<td class="py-4">
${item.fecha}
</td>

<td class="py-4 font-bold text-pink-600">
${item.bpm}
</td>

<td class="py-4 font-bold text-indigo-600">
${item.spo2}%
</td>

</tr>

`;

});

});

</script>

</body>
</html>
