<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitor MAX30102</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    margin-top:50px;
}

.card{
    background:#222;
    width:320px;
    margin:auto;
    padding:30px;
    border-radius:20px;
}

h1{
    color:#00ffcc;
}

.valor{
    font-size:50px;
    margin:20px;
}

</style>

</head>
<body>

<div class="card">

<h1>Monitor Oxígeno</h1>

<div>
    BPM
</div>

<div class="valor" id="bpm">
    0
</div>

<div>
    SpO2
</div>

<div class="valor" id="spo2">
    0
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqm-ifnDLIYLlZBafR-wIO87CqTIh9zd0",
  authDomain: "yassin-lerma.firebaseapp.com",
  databaseURL: "https://yassin-lerma-default-rtdb.firebaseio.com",
  projectId: "yassin-lerma",
  storageBucket: "yassin-lerma.firebasestorage.app",
  messagingSenderId: "854070019092",
  appId: "1:854070019092:web:11585b434dd224ff519301",
  measurementId: "G-K38ZF10HD8"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const datosRef = ref(db, 'oxigeno');

onValue(datosRef, (snapshot) => {

    const data = snapshot.val();

    console.log(data);

    if(data){

        document.getElementById("bpm").innerHTML = data.bpm;

        document.getElementById("spo2").innerHTML = data.spo2 + "%";
    }

});

</script>

</body>
</html>
