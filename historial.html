<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumi Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; background:#f8fafc; }
.card { background:white; border-radius:2rem; padding:1.5rem; }
</style>
</head>

<body>

<header class="p-4 bg-white shadow-sm">
  <h1 class="text-xl font-bold">Lumi</h1>
</header>

<main class="max-w-6xl mx-auto p-6">

<h2 class="text-2xl font-bold mb-6">Tu Salud en Resumen</h2>

<!-- TARJETAS -->
<div class="grid md:grid-cols-2 gap-6 mb-10">

  <div class="card shadow">
    <p class="text-gray-400">Oxigenación SpO2</p>
    <p class="text-4xl font-bold text-indigo-600" id="spo2Actual">--%</p>
  </div>

  <div class="card shadow">
    <p class="text-gray-400">Ritmo Cardíaco</p>
    <p class="text-4xl font-bold text-pink-600" id="bpmActual">-- BPM</p>
  </div>

</div>

<!-- HISTORIAL -->
<div class="card shadow">

<h3 class="text-xl font-bold mb-4">Historial de Lecturas</h3>

<table class="w-full text-left border-collapse">
  <thead>
    <tr class="border-b">
      <th class="p-2">Fecha</th>
      <th class="p-2">BPM</th>
      <th class="p-2">SpO2</th>
    </tr>
  </thead>

  <tbody id="tablaDatos"></tbody>
</table>

</div>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqm-ifnDLIYLlZBafR-wIO87CQ",
  authDomain: "yassin-lerma.firebaseapp.com",
  databaseURL: "https://yassin-lerma-default-rtdb.firebaseio.com",
  projectId: "yassin-lerma",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const datosRef = ref(db, "oxigeno");

onValue(datosRef, (snapshot) => {

    const data = snapshot.val();

    if (!data) return;

    let tabla = document.getElementById("tablaDatos");

    tabla.innerHTML = "";

    let ultima = null;

    // recorrer TODOS los registros
    Object.values(data).forEach(item => {

        if (!item) return;

        const bpm = item.bpm ?? 0;
        const spo2 = item.spo2 ?? 0;

        // fecha fija como pediste
        const fecha = "5/22/2026";

        tabla.innerHTML += `
          <tr class="border-b">
            <td class="p-2">${fecha}</td>
            <td class="p-2">${bpm}</td>
            <td class="p-2">${spo2}%</td>
          </tr>
        `;

        ultima = item;
    });

    // mostrar el último registro arriba
    if (ultima) {
        document.getElementById("bpmActual").innerText = (ultima.bpm ?? "--") + " BPM";
        document.getElementById("spo2Actual").innerText = (ultima.spo2 ?? "--") + "%";
    }

});

</script>

</body>
</html>
