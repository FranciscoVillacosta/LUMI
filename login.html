<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumi - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hero-gradient {
            background: radial-gradient(circle at 50% 50%, #e0e7ff 0%, #ffffff 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="hero-gradient min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Bienvenido</h1>
               <p class="text-gray-500 mt-3 text-lg">Ingresa a tu cuenta para continuar</p>
        </div>

         <div class="glass rounded-[2.5rem] p-10 shadow-2xl">
            <form action="#" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2 ml-1">Correo electrónico</label>
                    <input type="email" placeholder="tu@email.com" 
                           class="w-full px-5 py-4 rounded-2xl bg-white border border-gray-100 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all placeholder:text-gray-300">
                </div>

                <div>
                    <div class="flex justify-between mb-2 ml-1">
                        <label class="text-sm font-semibold text-gray-700">Contraseña</label>
                        <a href="#" class="text-xs text-indigo-600 font-medium hover:underline">¿Olvidaste tu contraseña?</a>
                    </div>
                    <input type="password" placeholder="••••••••" 
                           class="w-full px-5 py-4 rounded-2xl bg-white border border-gray-100 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all placeholder:text-gray-300">
                </div>

                <div class="flex items-center gap-2 ml-1">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                    <label for="remember" class="text-sm text-gray-500 cursor-pointer">Recordarme en este equipo</label>
                </div>

                <button class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 hover:scale-[1.01] active:scale-95 transition-all text-lg">
                    <a href="historial.html">Entrar</a>
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-gray-200/50 text-center">
                <p class="text-sm text-gray-500">
                    ¿No tienes una cuenta? 
                    <a href="#" class="text-indigo-600 font-bold hover:underline ml-1">Regístrate ahora</a>
                </p>
            </div>
        </div>

     <div class="mt-10 flex justify-center gap-8 text-xs text-gray-400 font-semibold uppercase tracking-widest">
            <a href="#" class="hover:text-indigo-500 transition-colors">Soporte</a>
            <a href="#" class="hover:text-indigo-500 transition-colors">Privacidad</a>
            <a href="#" class="hover:text-indigo-500 transition-colors">Legal</a>
        </div>
    </div>

</body>
</html>
